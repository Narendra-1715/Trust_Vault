name: TrustVault CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Migrations, PostgreSQL 16 & Security Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trustvault_test
          POSTGRES_PASSWORD: trustvault_test_password
          POSTGRES_DB: trustvault_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://trustvault_test:trustvault_test_password@localhost:5432/trustvault_test_db
      TEST_DATABASE_URL: postgresql+psycopg://trustvault_test:trustvault_test_password@localhost:5432/trustvault_test_db
      SECRET_KEY: ci_workflow_super_secret_key_for_testing_2026
      STORAGE_DIR: /tmp/trustvault_ci_storage
      AI_PROVIDER: mock
      ENVIRONMENT: testing
      HYPOTHESIS_PROFILE: ci
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run database migrations against PostgreSQL 16
        run: |
          cd backend
          alembic upgrade head

      - name: Run seed verification against PostgreSQL 16
        run: |
          cd backend
          python seed.py

      - name: Run automated test suite with Hypothesis & PostgreSQL
        run: |
          cd backend
          pytest -v --tb=short

  frontend-check:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linter
        run: |
          cd frontend
          npm run lint

      - name: Typecheck and build
        run: |
          cd frontend
          npm run build

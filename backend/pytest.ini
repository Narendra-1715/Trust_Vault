[pytest]
pythonpath = . ..
testpaths = app/tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::PendingDeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    security: marks tests as part of the security test suite
    hypothesis: marks property-based hypothesis tests
    postgres: marks tests requiring real PostgreSQL database

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustvault_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustvault_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustvault_secure_db_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-trustvault_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustvault_admin} -d ${POSTGRES_DB:-trustvault_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustvault_prod_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustvault_prod_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trustvault_admin}:${POSTGRES_PASSWORD:-trustvault_secure_db_pass_2026}@postgres:5432/${POSTGRES_DB:-trustvault_prod}
      SECRET_KEY: ${SECRET_KEY}
      STORAGE_DIR: /app/data/vault_storage
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-3.8-flash}
      ENVIRONMENT: production
      DEBUG: "false"
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-*}
    volumes:
      - vault_prod_storage:/app/data/vault_storage
    networks:
      - trustvault_prod_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustvault_prod_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - trustvault_prod_net

volumes:
  postgres_prod_data:
  vault_prod_storage:

networks:
  trustvault_prod_net:
    driver: bridge

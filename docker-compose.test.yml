version: '3.8'

services:
  postgres_test:
    image: postgres:16-alpine
    container_name: trustvault_postgres_test
    restart: "no"
    environment:
      POSTGRES_USER: trustvault_test
      POSTGRES_PASSWORD: trustvault_test_password
      POSTGRES_DB: trustvault_test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustvault_test -d trustvault_test_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - trustvault_test_net

  backend_test_runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustvault_test_runner
    restart: "no"
    depends_on:
      postgres_test:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://trustvault_test:trustvault_test_password@postgres_test:5432/trustvault_test_db
      DATABASE_URL: postgresql+psycopg://trustvault_test:trustvault_test_password@postgres_test:5432/trustvault_test_db
      SECRET_KEY: test_secret_key_for_scaffolding_and_property_tests_2026
      STORAGE_DIR: /tmp/test_vault_storage
      AI_PROVIDER: mock
      ENVIRONMENT: testing
      HYPOTHESIS_PROFILE: ci
    command: ["pytest", "-v", "--tb=short", "-m", "not slow"]
    networks:
      - trustvault_test_net

networks:
  trustvault_test_net:
    driver: bridge

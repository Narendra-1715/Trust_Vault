services:
  # Backend API Web Service
  - type: web
    name: trustvault-api
    plan: free
    runtime: python
    autoDeploy: true
    rootDir: backend
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_DIR
        value: /data/vault_storage
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: BACKEND_CORS_ORIGINS
        value: "https://trustvault-ui.onrender.com"

  # Frontend Web UI (Render Free Static Site)
  - type: web
    name: trustvault-ui
    runtime: static
    autoDeploy: true
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: trustvault-api
          property: host

databases:
  # Managed PostgreSQL Database (Render Free Tier)
  - name: trustvault-postgres
    plan: free
    databaseName: trustvault
    user: trustvault_user
